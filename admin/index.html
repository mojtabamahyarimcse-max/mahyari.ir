

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVONEX | Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080e1c;color:#edf4ff;font-family:Vazirmatn,sans-serif}
.container{max-width:1150px;margin:auto;padding:25px 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:25px}
.logo{display:flex;align-items:center;gap:12px}
.logo img{width:45px;height:45px;object-fit:contain}
h1{font-size:22px;margin:0}
p{color:#91a5c2}
.panel{background:#111c30;border:1px solid #263750;border-radius:17px;padding:22px;margin-bottom:18px}
input,textarea,select{width:100%;padding:12px;background:#091425;border:1px solid #31445f;border-radius:9px;color:white;font:inherit;margin:7px 0 15px}
button{border:0;border-radius:9px;padding:10px 16px;background:#3196f5;color:white;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
.danger{background:#8f2941}
.secondary{background:#243b5c}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:#0b1729;padding:17px;border-radius:12px}
.stat span{font-size:12px;color:#9aafca}
.stat strong{display:block;font-size:25px;margin-top:7px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:180px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{text-align:right;padding:13px;border-bottom:1px solid #283750;font-size:13px;vertical-align:top}
th{color:#9ecbff}
td{max-width:260px;overflow-wrap:anywhere}
.status{min-width:130px}
.actions{display:flex;gap:6px}
#notice{padding:12px;border-radius:9px;margin:12px 0;display:none;white-space:pre-wrap}
.ok{background:#123b30;color:#a5f3d0}
.error{background:#421c2b;color:#ffc0ca}
.login{max-width:430px;margin:9vh auto}
@media(max-width:650px){.grid{grid-template-columns:1fr}.container{padding:15px}}
</style>
</head>
<body>
<div class="container">

<header>
 <div class="logo">
  <img src="../images/evonex-logo.png" alt="EVONEX">
  <div><h1>EVONEX</h1><small>ADMINISTRATION PANEL</small></div>
 </div>
 <button id="logout" class="danger hidden">خروج</button>
</header>

<section id="login" class="panel login">
 <h1>ورود مدیر</h1>
 <p>برای ورود به پنل مدیریت احراز هویت شوید.</p>
 <form id="loginForm">
  <label>ایمیل</label>
  <input id="email" type="email" required autocomplete="username">
  <label>رمز عبور</label>
  <input id="password" type="password" required autocomplete="current-password">
  <button id="loginBtn" style="width:100%">ورود به پنل</button>
 </form>
</section>

<section id="dashboard" class="hidden">
 <div class="panel">
  <h1>داشبورد مدیریت</h1>
  <p id="welcome">مدیریت درخواست‌های مشتریان EVONEX</p>
  <div class="grid">
   <div class="stat"><span>کل درخواست‌ها</span><strong id="total">۰</strong></div>
   <div class="stat"><span>در انتظار بررسی</span><strong id="pending">۰</strong></div>
   <div class="stat"><span>تکمیل‌شده</span><strong id="done">۰</strong></div>
  </div>
 </div>

 <div class="panel">
  <h1>درخواست‌های تماس</h1>
  <div class="toolbar">
   <input id="search" placeholder="جستجو نام، موبایل، ایمیل یا پیام...">
   <button id="refresh">بروزرسانی</button>
   <button id="csv" class="secondary">خروجی CSV</button>
  </div>
  <div id="notice"></div>
  <div class="tablewrap">
   <table>
    <thead>
     <tr>
      <th>نام</th><th>موبایل</th><th>ایمیل</th>
      <th>پیام</th><th>تاریخ</th><th>وضعیت</th><th>عملیات</th>
     </tr>
    </thead>
    <tbody id="rows"></tbody>
   </table>
  </div>
 </div>
</section>
</div>

<script>
const SUPABASE_URL="https://hwuligsvwldpkpjqbqkz.supabase.co";
const SUPABASE_KEY="sb_publishable_9MQcV2MGa7zAaNLYZLEVeg_IZg3axS9";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let records=[];

function notify(message,type="ok"){
 const n=$("notice");
 n.textContent=message;
 n.className=type;
 n.style.display="block";
}
function fa(n){return Number(n).toLocaleString("fa-IR")}
function element(tag,text){
 const e=document.createElement(tag);
 e.textContent=text??"";
 return e;
}

async function checkSession(){
 const {data,error}=await db.auth.getSession();
 if(error){notify(error.message,"error");return}
 if(data.session) await enter(data.session.user);
}

async function enter(user){
 $("login").classList.add("hidden");
 $("dashboard").classList.remove("hidden");
 $("logout").classList.remove("hidden");
 $("welcome").textContent="حساب: "+(user.email||"مدیر");
 await load();
}

$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=$("loginBtn");
 btn.disabled=true;
 btn.textContent="در حال ورود...";
 const {data,error}=await db.auth.signInWithPassword({
  email:$("email").value.trim(),
  password:$("password").value
 });
 btn.disabled=false;
 btn.textContent="ورود به پنل";
 if(error){alert("ورود ناموفق: "+error.message);return}
 $("password").value="";
 await enter(data.user);
});

$("logout").onclick=async()=>{
 await db.auth.signOut();
 location.reload();
};

async function load(){
 $("refresh").disabled=true;
 const {data,error}=await db.from("contact_requests")
  .select("id,name,mobile,email,message,status,created_at")
  .order("created_at",{ascending:false});
 $("refresh").disabled=false;
 if(error){
  notify("خطا در دریافت درخواست‌ها: "+error.message,"error");
  return;
 }
 records=data||[];
 $("total").textContent=fa(records.length);
 $("pending").textContent=fa(records.filter(x=>x.status==="pending"||x.status==="new").length);
 $("done").textContent=fa(records.filter(x=>x.status==="done"||x.status==="completed").length);
 render();
}

function render(){
 const q=$("search").value.trim().toLowerCase();
 const list=records.filter(r=>
  [r.name,r.mobile,r.email,r.message,r.status]
  .some(v=>String(v??"").toLowerCase().includes(q))
 );
 const body=$("rows");
 body.replaceChildren();

 if(!list.length){
  const tr=element("tr");
  const td=element("td","درخواستی پیدا نشد.");
  td.colSpan=7;tr.append(td);body.append(tr);return;
 }

 list.forEach(r=>{
  const tr=document.createElement("tr");
  [r.name,r.mobile,r.email,r.message,
   new Date(r.created_at).toLocaleString("fa-IR")
  ].forEach(v=>tr.append(element("td",v)));

  const statusTd=element("td");
  const select=element("select");
  select.className="status";
  ["pending","new","in_progress","done","completed"].forEach(v=>{
   const op=element("option",v);
   op.value=v;
   select.append(op);
  });
  select.value=r.status;
  if(!["pending","new","in_progress","done","completed"].includes(r.status)){
   select.add(element("option",r.status));
   select.value=r.status;
  }
  statusTd.append(select);tr.append(statusTd);

  const actions=element("td");
  const group=element("div");
  group.className="actions";
  const save=element("button","ذخیره");
  save.onclick=()=>updateStatus(r,select.value,save);
  const del=element("button","حذف");
  del.className="danger";
  del.onclick=()=>deleteRecord(r,del);
  group.append(save,del);actions.append(group);tr.append(actions);
  body.append(tr);
 });
}

async function updateStatus(r,status,btn){
 if(!confirm("وضعیت این درخواست تغییر کند؟"))return;
 btn.disabled=true;
 const {error}=await db.from("contact_requests")
  .update({status}).eq("id",r.id);
 btn.disabled=false;
 if(error){notify("خطا: "+error.message,"error");return}
 notify("وضعیت با موفقیت ذخیره شد.");
 await load();
}

async function deleteRecord(r,btn){
 if(!confirm("این درخواست برای همیشه حذف شود؟"))return;
 btn.disabled=true;
 const {error}=await db.from("contact_requests")
  .delete().eq("id",r.id);
 btn.disabled=false;
 if(error){notify("خطا در حذف: "+error.message,"error");return}
 notify("درخواست حذف شد.");
 await load();
}

function csvValue(v){
 return '"'+String(v??"").replace(/"/g,'""')+'"';
}
$("csv").onclick=()=>{
 const cols=["id","name","mobile","email","message","status","created_at"];
 const csv=[
  cols.map(csvValue).join(","),
  ...records.map(r=>cols.map(c=>csvValue(r[c])).join(","))
 ].join("\r\n");
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=element("a");
 a.href=url;a.download="evonex-requests.csv";
 a.click();URL.revokeObjectURL(url);
};

$("search").addEventListener("input",render);
$("refresh").onclick=load;

checkSession();
</script>
</body>
</html>
